name: Production Build Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static production site
        run: npm run build
      - name: Verify exported pages
        run: |
          test -f out/index.html
          test -f out/services/index.html
          test -f out/destinations/index.html
          test -f out/scholarships/index.html
          test -f out/ielts/index.html
          test -f out/education-loans/index.html
          test -f out/contact/index.html
