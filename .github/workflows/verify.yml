name: Verify Fusion Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/services/index.html
          test -f out/destinations/index.html
          test -f out/scholarships/index.html
          test -f out/ielts/index.html
          test -f out/education-loans/index.html
          test -f out/contact/index.html

      - name: Upload static preview
        uses: actions/upload-artifact@v4
        with:
          name: fusion-static-preview
          path: out
          if-no-files-found: error
          retention-days: 3
